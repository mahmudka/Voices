[project]
name = "ml-service"
version = "0.1.0"
description = "Voice Converter ML Service"
requires-python = ">=3.11"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python    = ">=3.11,<3.12"
numpy     = ">=1.26"
scipy     = ">=1.12"
librosa   = ">=0.10"
fastapi   = ">=0.110"
uvicorn   = ">=0.29"
libsndfile = "*"
ffmpeg    = "*"
av = ">=17.1.0,<18"

[tool.pixi.pypi-dependencies]
python-multipart = ">=0.0.9"
edge-tts         = ">=7.0"
requests         = ">=2.31"

[tool.pixi.tasks]
serve = "uvicorn main:app --host 0.0.0.0 --port 8001"
